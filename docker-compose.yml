services:
  backend:
    build: ./back-end
    env_file:
      - ./back-end/.env
    ports:
      - "5000:5000"
    volumes:
      - ./back-end/data:/app/data
      - ./back-end/uploads:/app/uploads
      - ./back-end/static/results:/app/static/results
  frontend:
    build:
      context: ./front-end
      args:
        VITE_API_BASE_URL: https://api.verifast.zeacrm.com
    ports:
      - "5173:5173"
    depends_on:
      - backend
